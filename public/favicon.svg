<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3d91"/>
      <stop offset="50%" stop-color="#f07d19"/>
      <stop offset="100%" stop-color="#0b3d91"/>
    </linearGradient>
  </defs>
  <!-- Deep space background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <!-- Orbital ring -->
  <ellipse cx="50" cy="50" rx="36" ry="12" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.8"/>
  <!-- Planet body -->
  <circle cx="50" cy="50" r="18" fill="#0b3d91" opacity="0.9"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#f07d19" stroke-width="1.5" opacity="0.6"/>
  <!-- Star dots (astrophage inspiration) -->
  <circle cx="20" cy="25" r="1.5" fill="#f07d19" opacity="0.8"/>
  <circle cx="78" cy="30" r="1" fill="#4a90d9" opacity="0.7"/>
  <circle cx="28" cy="72" r="1.2" fill="#4a90d9" opacity="0.7"/>
  <circle cx="72" cy="70" r="1" fill="#f07d19" opacity="0.6"/>
  <circle cx="15" cy="50" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="85" cy="55" r="1.2" fill="#fff" opacity="0.4"/>
  <!-- "H" text -->
  <text x="50" y="56" text-anchor="middle" font-family="'Space Grotesk',Arial,sans-serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="-1">H</text>
</svg>
